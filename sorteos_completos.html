<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Exportar DB La Diaria — Todos los años</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css?v=8" />
  <link rel="stylesheet" href="./src/theme/base.css?v=8" />
  <link rel="stylesheet" href="./src/theme/aurora.css?v=8" />
  <script>window.__ENV__ = window.__ENV__ || {};</script>
  <script>
    (function enforceSession() {
      if (localStorage.getItem("auth") !== "true") {
        window.location.href = "./login.html";
      }
    })();
  </script>
  <script type="module">
    import { DB } from "./src/storage.js";

    function downloadJson(filename, data) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    (async () => {
      try {
        const data = await DB.listDraws({ excludeTest: false });
        if (!Array.isArray(data) || !data.length) {
          showStatus("No se encontraron sorteos registrados.", "error");
          return;
        }
        downloadJson("sorteos_completos.json", data);
        showStatus(`Exportados ${data.length} registros desde Supabase.`, "success");
      } catch (err) {
        console.error(err);
        showStatus("Error al intentar exportar la base. Revise la consola.", "error");
      }
    })();
  </script>
</head>

<body>
  <h1>Exportando base completa de La Diaria...</h1>
  <p>Espere unos segundos, se descargará el archivo automáticamente.</p>
  <div id="status" style="margin-top:1rem;padding:1rem;border-radius:8px;display:none;font-family:sans-serif;"></div>
  <script>
    function showStatus(msg, type) {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.style.display = "block";
      el.style.background = type === "error" ? "#fef2f2" : type === "success" ? "#f0fdf4" : "#fffbeb";
      el.style.color = type === "error" ? "#b91c1c" : type === "success" ? "#15803d" : "#92400e";
      el.style.border = "1px solid " + (type === "error" ? "#fecaca" : type === "success" ? "#bbf7d0" : "#fde68a");
    }
  </script>
</body>

</html>
